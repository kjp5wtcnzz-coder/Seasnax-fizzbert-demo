<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Seasnax: Fizzbert Demo</title>
<style>
  :root {
    color-scheme: dark;
    --ink:#eefcff;
    --glass:rgba(4,26,45,.80);
    --line:rgba(164,239,255,.42);
    --fizz:#84f6ff;
    --gold:#ffd45f;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; min-height:100%; background:#031827; color:var(--ink); font-family:system-ui,-apple-system,Segoe UI,sans-serif; overflow-x:hidden; }
  body {
    display:flex; justify-content:center; align-items:flex-start;
    padding:max(10px, env(safe-area-inset-top)) 10px max(18px, env(safe-area-inset-bottom));
    background:
      radial-gradient(circle at 50% -15%, #167ba0 0, #07506e 25%, #031827 70%);
  }
  #shell { width:min(100%, 1000px); }
  header { display:flex; align-items:end; justify-content:space-between; gap:12px; margin:2px 2px 8px; }
  h1 { margin:0; font-size:clamp(21px,4vw,34px); line-height:1; letter-spacing:.02em; }
  .sub { opacity:.78; font-size:12px; text-align:right; }
  #frame {
    position:relative; width:100%; aspect-ratio:16/10; overflow:hidden;
    border:2px solid var(--line); border-radius:18px;
    background:#075574; box-shadow:0 16px 60px rgba(0,0,0,.35);
    touch-action:none;
  }
  canvas { display:block; width:100%; height:100%; }
  #hud {
    position:absolute; inset:10px 10px auto 10px; display:flex; align-items:flex-start; justify-content:space-between;
    pointer-events:none; gap:8px;
  }
  .panel {
    background:var(--glass); border:1px solid var(--line); border-radius:12px; padding:8px 10px;
    box-shadow:0 5px 18px rgba(0,0,0,.22); backdrop-filter:blur(4px);
  }
  #objective { max-width:66%; font-size:clamp(11px,2vw,15px); }
  #status { min-width:115px; text-align:right; font-size:clamp(11px,2vw,15px); }
  #message {
    position:absolute; left:50%; bottom:10px; transform:translateX(-50%);
    max-width:88%; text-align:center; font-weight:800; font-size:clamp(12px,2.2vw,17px);
    opacity:0; transition:opacity .15s;
  }
  #message.show { opacity:1; }
  #overlay {
    position:absolute; inset:0; display:grid; place-items:center; padding:22px;
    background:linear-gradient(rgba(1,18,30,.72), rgba(1,18,30,.88));
  }
  #overlay.hidden { display:none; }
  .card {
    width:min(520px, 94%); background:rgba(3,29,48,.96); border:2px solid var(--line);
    border-radius:20px; padding:22px; text-align:center; box-shadow:0 20px 70px rgba(0,0,0,.48);
  }
  .card h2 { margin:0 0 10px; font-size:clamp(26px,6vw,46px); }
  .card p { line-height:1.45; margin:10px 0; }
  button {
    border:0; border-radius:14px; font:inherit; font-weight:900; color:#062538;
    background:linear-gradient(#bafaff,#65eaff); padding:12px 18px; cursor:pointer;
    box-shadow:0 5px 0 #1999b1;
  }
  button:active { transform:translateY(3px); box-shadow:0 2px 0 #1999b1; }
  #controls {
    display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px;
    user-select:none; touch-action:none;
  }
  #dpad {
    display:grid; grid-template-columns:repeat(3,56px); grid-template-rows:repeat(3,48px);
    justify-content:start; gap:4px;
  }
  .ctl {
    min-width:0; padding:0; border-radius:12px; background:rgba(145,236,255,.93); box-shadow:0 4px 0 #197f9a;
    font-size:24px; display:grid; place-items:center;
  }
  .ctl.blank { visibility:hidden; }
  #actions { display:flex; align-items:center; justify-content:flex-end; gap:10px; }
  #fizzBtn {
    width:112px; height:112px; border-radius:50%; font-size:20px; background:radial-gradient(circle at 35% 25%, #eaffff, #68f6ff 38%, #22b7d4);
  }
  #restartBtn { color:#fff; background:#173b50; box-shadow:0 4px 0 #0b2636; padding:10px 12px; }
  .keyboard { opacity:.7; font-size:12px; text-align:center; margin-top:8px; }
  @media (min-width:720px) {
    #controls { max-width:700px; margin:12px auto 0; }
    #dpad { grid-template-columns:repeat(3,62px); grid-template-rows:repeat(3,52px); }
  }
</style>
</head>
<body>
<div id="shell">
  <header>
    <h1>SEASNAX: FIZZBERT DEMO</h1>
    <div class="sub">Bare-minimum edition 🌊🥒</div>
  </header>

  <div id="frame">
    <canvas id="game" width="960" height="600" aria-label="Seasnax game"></canvas>
    <div id="hud">
      <div id="objective" class="panel"><b>GOAL:</b> Drop fizz to lure Seacu into the open Snack Trap.</div>
      <div id="status" class="panel">Fizz: ∞<br>Hark bumps: <span id="bumps">0</span></div>
    </div>
    <div id="message" class="panel"></div>
    <div id="overlay">
      <div class="card">
        <h2 id="overlayTitle">FIZZBERT DEMO</h2>
        <p id="overlayText">Seado: “Lure that Seacu into the Snack Trap with fizz. Also… please don’t get rammed by the ham shark.”</p>
        <button id="playBtn">PLAY</button>
        <div class="keyboard">Move: WASD / arrow keys · Drop fizz: Space</div>
      </div>
    </div>
  </div>

  <div id="controls">
    <div id="dpad" aria-label="Movement controls">
      <button class="ctl blank" tabindex="-1"></button>
      <button class="ctl" data-key="up">▲</button>
      <button class="ctl blank" tabindex="-1"></button>
      <button class="ctl" data-key="left">◀</button>
      <button class="ctl blank" tabindex="-1"></button>
      <button class="ctl" data-key="right">▶</button>
      <button class="ctl blank" tabindex="-1"></button>
      <button class="ctl" data-key="down">▼</button>
      <button class="ctl blank" tabindex="-1"></button>
    </div>
    <div id="actions">
      <button id="restartBtn">RESTART</button>
      <button id="fizzBtn">DROP<br>FIZZ</button>
    </div>
  </div>
</div>

  const keys = {up:false,down:false,left:false,right:false};
  let running = false;
  let won = false;
  let last = performance.now();
  let messageTimer = 0;
  let fizzCooldown = 0;
  let bumps = 0;
  let bubbles = [];
  let particles = [];

  const player = {x:135,y:315,r:22,speed:225,inv:0};
  const seacu = {x:500,y:245,w:83,h:120,vx:0,vy:0,target:null,wander:0};
  const hark = {x:755,y:430,w:170,h:112,t:0};
  const trap = {x:770,y:105,w:132,h:104};

  function reset(showOverlay=false) {
    player.x=135; player.y=315; player.inv=0;
    seacu.x=500; seacu.y=245; seacu.vx=0; seacu.vy=0; seacu.target=null; seacu.wander=0;
    hark.x=755; hark.y=430; hark.t=0;
    bubbles=[]; particles=[]; bumps=0; bumpsEl.textContent="0";
    won=false; running=!showOverlay; fizzCooldown=0;
    overlay.classList.toggle("hidden", !showOverlay);
    overlayTitle.textContent="FIZZBERT DEMO";
    overlayText.textContent="Seado: “Lure that Seacu into the Snack Trap with fizz. Also… please don’t get rammed by the ham shark.”";
    playBtn.textContent="PLAY";
  }

  function showMessage(text, seconds=1.5) {
    messageEl.textContent=text;
    messageEl.classList.add("show");
    messageTimer=seconds;
  }

  function dropFizz() {
    if (!running || won || fizzCooldown>0) return;
    fizzCooldown=.32;
    bubbles.push({x:player.x,y:player.y,life:9,pulse:Math.random()*6});
    if (bubbles.length>8) bubbles.shift();
    for(let i=0;i<8;i++) particles.push({
      x:player.x+(Math.random()-.5)*18,
      y:player.y+(Math.random()-.5)*18,
      vx:(Math.random()-.5)*45, vy:-25-Math.random()*45, life:.7+Math.random()*.5
    });
    showMessage("PSSHHH—FIZZ DROPPED!", .65);
  }

  function dist(ax,ay,bx,by) { return Math.hypot(ax-bx,ay-by); }
  function clamp(v,a,b) { return Math.max(a,Math.min(b,v)); }

  function update(dt) {
    if (!running || won) return;
    fizzCooldown=Math.max(0,fizzCooldown-dt);
    player.inv=Math.max(0,player.inv-dt);

    let dx=(keys.right?1:0)-(keys.left?1:0);
    let dy=(keys.down?1:0)-(keys.up?1:0);
    if(dx||dy) {
      const n=Math.hypot(dx,dy); dx/=n; dy/=n;
      player.x+=dx*player.speed*dt; player.y+=dy*player.speed*dt;
    }
    player.x=clamp(player.x,35,W-35); player.y=clamp(player.y,70,H-35);

    for (const b of bubbles) { b.life-=dt; b.pulse+=dt*4; }
    bubbles=bubbles.filter(b=>b.life>0);

    // Seacu follows the nearest fizz. Without fizz, it slowly wiggles.
    let target=null, best=Infinity;
    for(const b of bubbles) {
      const d=dist(seacu.x,seacu.y,b.x,b.y);
      if(d<best) {best=d; target=b;}
    }
    if(target) {
      const tx=target.x-seacu.x, ty=target.y-seacu.y;
      const n=Math.hypot(tx,ty)||1;
      const speed=88;
      seacu.vx+=(tx/n*speed-seacu.vx)*Math.min(1,dt*3.5);
      seacu.vy+=(ty/n*speed-seacu.vy)*Math.min(1,dt*3.5);
      if(best<28) target.life=0;
    } else {
      seacu.wander+=dt;
      const tx=Math.cos(seacu.wander*.8)*20, ty=Math.sin(seacu.wander*1.1)*13;
      seacu.vx+=(tx-seacu.vx)*Math.min(1,dt*1.4);
      seacu.vy+=(ty-seacu.vy)*Math.min(1,dt*1.4);
    }
    seacu.x+=seacu.vx*dt; seacu.y+=seacu.vy*dt;
    seacu.x=clamp(seacu.x,55,W-55); seacu.y=clamp(seacu.y,100,H-55);

    // Hark patrols, but charges if the player gets close.
    hark.t+=dt;
    const pd=dist(hark.x,hark.y,player.x,player.y);
    let hx,hy,hs;
    if(pd<285) {
      hx=player.x-hark.x; hy=player.y-hark.y; hs=92;
    } else {
      const patrolX=770+Math.cos(hark.t*.55)*120;
      const patrolY=410+Math.sin(hark.t*.75)*85;
      hx=patrolX-hark.x; hy=patrolY-hark.y; hs=58;
    }
    const hn=Math.hypot(hx,hy)||1;
    hark.x+=hx/hn*hs*dt; hark.y+=hy/hn*hs*dt;

    if(player.inv<=0 && dist(hark.x,hark.y,player.x,player.y)<62) {
      bumps++; bumpsEl.textContent=String(bumps); player.inv=1.5;
      player.x=130; player.y=320;
      bubbles=[];
      showMessage("HARK BUMPED YOU! FIZZ TRAIL LOST.",1.5);
    }

    // Win when Seacu's center enters the open trap.
    if(seacu.x>trap.x-10 && seacu.x<trap.x+trap.w+10 &&
       seacu.y>trap.y-5 && seacu.y<trap.y+trap.h+15) {
      win();
    }

    for(const p of particles) { p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; }
    particles=particles.filter(p=>p.life>0);
  }

  function win() {
    won=true; running=false;
    for(let i=0;i<55;i++) particles.push({
      x:trap.x+trap.w/2, y:trap.y+trap.h/2,
      vx:(Math.random()-.5)*320, vy:(Math.random()-.5)*260,
      life:1.2+Math.random()*1.4
    });
    setTimeout(()=>{
      overlayTitle.textContent="FIZZBERT ACQUIRED!";
      overlayText.textContent="Seado: “WAIT—you caught a Seacu?! Can I keep it? IT’S ADORABLE! I’m gonna name you… Fizzbert!”";
      playBtn.textContent="PLAY AGAIN";
      overlay.classList.remove("hidden");
    },550);
  }

  function roundRect(x,y,w,h,r,fill,stroke=null,lw=2) {
    ctx.beginPath();
    ctx.roundRect(x,y,w,h,r);
    if(fill) {ctx.fillStyle=fill;ctx.fill();}
    if(stroke) {ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}
  }

  function drawBackground(t) {
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,"#087c9e"); g.addColorStop(.55,"#075d7a"); g.addColorStop(1,"#04374d");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    // Fizz lakes.
    ctx.globalAlpha=.65;
    for(let i=0;i<5;i++) {
      const x=115+i*205+(i%2)*35;
      const y=95+(i%3)*180;
      ctx.fillStyle="rgba(100,245,255,.20)";
      ctx.beginPath(); ctx.ellipse(x,y,110,48,Math.sin(i)*.2,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle="rgba(190,255,255,.30)"; ctx.lineWidth=3; ctx.stroke();
    }

    // Drifting fizz bubbles.
    for(let i=0;i<28;i++) {
      const x=(i*157 + t*18*(1+(i%3)*.15))%W;
      const y=(H-((i*83+t*22*(1+(i%4)*.12))%H));
      const r=2+(i%5);
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
      ctx.fillStyle="rgba(205,255,255,.32)"; ctx.fill();
    }
    ctx.globalAlpha=1;

    // Seabed.
    ctx.fillStyle="#b18b4d"; ctx.fillRect(0,H-42,W,42);
    ctx.fillStyle="#806638";
    for(let i=0;i<22;i++) {
      ctx.beginPath(); ctx.ellipse((i*83)%W,H-34+(i%3)*8,7+(i%5)*2,3+(i%4),0,0,Math.PI*2); ctx.fill();
    }
  }

  function drawTrap() {
    const x=trap.x,y=trap.y,w=trap.w,h=trap.h;
    ctx.save();
    ctx.shadowColor="rgba(255,226,90,.55)"; ctx.shadowBlur=18;
    roundRect(x,y,w,h,16,"rgba(28,55,62,.82)","#ffe66a",5);
    ctx.shadowBlur=0;
    ctx.fillStyle="#8e9aa0"; ctx.fillRect(x+10,y+23,w-20,8);
    ctx.fillRect(x+10,y+h-30,w-20,8);
    ctx.strokeStyle="#cbd9dd"; ctx.lineWidth=4;
    for(let i=0;i<5;i++) {
      const bx=x+20+i*23;
      ctx.beginPath(); ctx.moveTo(bx,y+28); ctx.lineTo(bx,y+h-29); ctx.stroke();
    }
    ctx.fillStyle="#ffe66a"; ctx.font="900 16px system-ui"; ctx.textAlign="center";
    ctx.fillText("SNACK TRAP",x+w/2,y-10);
    ctx.restore();
  }

  function drawFizz() {
    for(const b of bubbles) {
      const a=Math.min(1,b.life/1.2);
      ctx.globalAlpha=a;
      const r=16+Math.sin(b.pulse)*3;
      const grad=ctx.createRadialGradient(b.x-5,b.y-6,2,b.x,b.y,r);
      grad.addColorStop(0,"#efffff"); grad.addColorStop(.3,"#8ffaff"); grad.addColorStop(1,"rgba(37,201,230,.15)");
      ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(b.x,b.y,r,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle="#bcffff"; ctx.lineWidth=2; ctx.stroke();
    }
    ctx.globalAlpha=1;
  }

  function drawPlayer() {
    ctx.save();
    ctx.translate(player.x,player.y);
    if(player.inv>0 && Math.floor(player.inv*12)%2===0) ctx.globalAlpha=.28;
    ctx.fillStyle="#e7bd74"; ctx.beginPath(); ctx.arc(0,0,player.r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#164d63"; ctx.beginPath(); ctx.arc(4,-2,13,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#8cf8ff"; ctx.beginPath(); ctx.arc(8,-4,7,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle="#f7e1ae"; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(-12,16);ctx.lineTo(-20,29);ctx.moveTo(10,17);ctx.lineTo(18,29);ctx.stroke();
    ctx.fillStyle="#fff3b0"; ctx.font="800 12px system-ui"; ctx.textAlign="center"; ctx.fillText("YOU",0,-31);
    ctx.restore();
  }

  function drawCreatures() {
    // Hark flips toward its movement target.
    ctx.save();
    ctx.translate(hark.x,hark.y);
    const faceLeft = player.x < hark.x;
    ctx.scale(faceLeft?1:-1,1);
    ctx.drawImage(harkImg,-hark.w/2,-hark.h/2,hark.w,hark.h);
    ctx.restore();

    // Seacu.
    ctx.save();
    ctx.translate(seacu.x,seacu.y);
    const angle=Math.atan2(seacu.vy,seacu.vx)+Math.PI/2;
    ctx.rotate(clamp(angle,-.42,.42));
    ctx.drawImage(seacuImg,-seacu.w/2,-seacu.h/2,seacu.w,seacu.h);
    ctx.restore();
  }

  function drawParticles() {
    for(const p of particles) {
      ctx.globalAlpha=Math.max(0,p.life);
      ctx.fillStyle=p.vx>0?"#ffe86a":"#8df8ff";
      ctx.beginPath(); ctx.arc(p.x,p.y,3+Math.max(0,p.life)*2,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  function render(now) {
    drawBackground(now/1000);
    drawTrap();
    drawFizz();
    drawPlayer();
    drawCreatures();
    drawParticles();
    if(messageTimer>0) {
      messageTimer-=Math.min(.05,(performance.now()-last)/1000);
      if(messageTimer<=0) messageEl.classList.remove("show");
    }
  }

  function loop(now) {
    const dt=Math.min(.033,(now-last)/1000);
    last=now;
    update(dt); render(now);
    requestAnimationFrame(loop);
  }

  function setKey(name,value) { keys[name]=value; }
  const keyMap={ArrowUp:"up",KeyW:"up",ArrowDown:"down",KeyS:"down",ArrowLeft:"left",KeyA:"left",ArrowRight:"right",KeyD:"right"};
  addEventListener("keydown",e=>{
    if(keyMap[e.code]) {e.preventDefault();setKey(keyMap[e.code],true);}
    if(e.code==="Space") {e.preventDefault();dropFizz();}
  });
  addEventListener("keyup",e=>{if(keyMap[e.code]) setKey(keyMap[e.code],false);});

  document.querySelectorAll("[data-key]").forEach(btn=>{
    const name=btn.dataset.key;
    const on=e=>{e.preventDefault();setKey(name,true);};
    const off=e=>{e.preventDefault();setKey(name,false);};
    btn.addEventListener("pointerdown",on);
    btn.addEventListener("pointerup",off);
    btn.addEventListener("pointercancel",off);
    btn.addEventListener("pointerleave",off);
  });

  document.getElementById("fizzBtn").addEventListener("pointerdown",e=>{e.preventDefault();dropFizz();});
  document.getElementById("restartBtn").addEventListener("click",()=>reset(false));
  playBtn.addEventListener("click",()=>{reset(false);overlay.classList.add("hidden");running=true;});
  document.addEventListener("visibilitychange",()=>{last=performance.now();});

  reset(true);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
